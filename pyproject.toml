[project]
name = "tensorfold-utils"
version = "0.3.9"
description = "Draft-vocabulary builders for TensorFold / vLLM MTP speculative decoding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tokenizers==0.22.2"]

[project.scripts]
tf-util = "tf_util:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tf_util"]
